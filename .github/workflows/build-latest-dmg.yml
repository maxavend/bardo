name: Build Latest DMG

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-latest-dmg:
    name: Build Bardo latest DMG
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Run DMG verifier fixture
        run: .github/scripts/test-verify-dmg.sh

      - name: Run unit tests
        run: |
          set +e
          xcodegen generate
          xcodebuild \
            -project Bardo.xcodeproj \
            -scheme Bardo \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            test > xcode-test.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "---- XCTest failure summary ----"
            grep -E "Test Case .* (failed|passed)|/[A-Za-z0-9_./-]+\.swift:[0-9]+|: error:|XCTAssert|failed -|\*\* TEST FAILED \*\*" xcode-test.log || tail -n 160 xcode-test.log
          else
            grep -E "Executed [0-9]+ tests|\*\* TEST SUCCEEDED \*\*" xcode-test.log || true
          fi
          exit "$STATUS"

      - name: Build and verify mounted Latest DMG
        env:
          DMG_PATH: Bardo-Latest.dmg
          DMG_VOLUME_NAME: Bardo Latest
        run: |
          set -o pipefail
          .github/scripts/verify-dmg.sh 2>&1 | tee mounted-validation.log

      - name: Upload Latest DMG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bardo-Latest-DMG-${{ github.run_id }}
          path: |
            Bardo-Latest.dmg
            Bardo-Latest.dmg.sha256
            mounted-validation.log
            xcode-test.log
          if-no-files-found: warn
          retention-days: 14
