name: Build Test DMG

"on":
  push:
    branches:
      - chore/testing-build
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-dmg:
    name: Build Bardo test DMG
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify test-build configuration
        run: |
          test -f Bardo/Bardo.entitlements
          test -f Bardo/Resources/BardoIcon.png
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' Bardo/Bardo.entitlements)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' Bardo/Bardo.entitlements)" = "true"
          BUILD_SETTINGS="$(xcodebuild -project Bardo.xcodeproj -scheme Bardo -configuration Release -showBuildSettings)"
          grep -Fq 'CODE_SIGN_ENTITLEMENTS = Bardo/Bardo.entitlements' <<< "$BUILD_SETTINGS"
          grep -Fq 'ENABLE_HARDENED_RUNTIME = YES' <<< "$BUILD_SETTINGS"
          grep -Fq 'ARCHS = arm64' <<< "$BUILD_SETTINGS"

      - name: Build Release app
        run: |
          xcodebuild \
            -project Bardo.xcodeproj \
            -scheme Bardo \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify application bundle
        run: |
          APP=.derived-data/Build/Products/Release/Bardo.app
          test -f "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/Bardo"
          test -f "$APP/Contents/Resources/BardoIcon.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = "BardoIcon.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist")" = "Bardo records microphone audio only when you choose to start a local recording."
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$APP/Contents/Info.plist")" = "Bardo captures audio from content you explicitly choose using the macOS system sharing picker."
          test "$(sips -g pixelWidth "$APP/Contents/Resources/BardoIcon.png" | awk '/pixelWidth/ {print $2}')" = "256"
          test "$(sips -g pixelHeight "$APP/Contents/Resources/BardoIcon.png" | awk '/pixelHeight/ {print $2}')" = "256"
          lipo -archs "$APP/Contents/MacOS/Bardo" | grep -Fxq arm64

      - name: Ad-hoc sign test app
        run: |
          APP=.derived-data/Build/Products/Release/Bardo.app
          codesign \
            --force \
            --deep \
            --sign - \
            --options runtime \
            --entitlements Bardo/Bardo.entitlements \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/bardo-entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' /tmp/bardo-entitlements.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' /tmp/bardo-entitlements.plist)" = "true"

      - name: Create polished test DMG
        run: |
          set -euo pipefail

          APP=.derived-data/Build/Products/Release/Bardo.app
          ROOT=.dmg-root
          DMG=Bardo-Reliability-Test.dmg
          RW_DMG=/tmp/Bardo-Reliability-Test-rw.dmg
          VOLNAME="Bardo Test"
          MOUNT_POINT="/Volumes/$VOLNAME"

          rm -rf "$ROOT" "$DMG" "$DMG.sha256" "$RW_DMG"
          mkdir -p "$ROOT/.background"
          ditto "$APP" "$ROOT/Bardo.app"
          ln -s /Applications "$ROOT/Applications"

          cat > /tmp/BardoDMGBackground.swift <<'SWIFT'
          import AppKit

          let width: CGFloat = 720
          let height: CGFloat = 520
          let size = NSSize(width: width, height: height)

          guard
              let bitmap = NSBitmapImageRep(
                  bitmapDataPlanes: nil,
                  pixelsWide: Int(width),
                  pixelsHigh: Int(height),
                  bitsPerSample: 8,
                  samplesPerPixel: 4,
                  hasAlpha: true,
                  isPlanar: false,
                  colorSpaceName: .deviceRGB,
                  bytesPerRow: 0,
                  bitsPerPixel: 0
              )
          else {
              fatalError("Unable to create DMG background bitmap")
          }

          bitmap.size = size

          guard let context = NSGraphicsContext(bitmapImageRep: bitmap) else {
              fatalError("Unable to create drawing context")
          }

          func rectFromTop(x: CGFloat, y: CGFloat, width: CGFloat, height: CGFloat) -> NSRect {
              NSRect(x: x, y: 520 - y - height, width: width, height: height)
          }

          func drawText(
              _ text: String,
              in rect: NSRect,
              font: NSFont,
              color: NSColor,
              alignment: NSTextAlignment = .center,
              lineSpacing: CGFloat = 0
          ) {
              let paragraph = NSMutableParagraphStyle()
              paragraph.alignment = alignment
              paragraph.lineBreakMode = .byWordWrapping
              paragraph.lineSpacing = lineSpacing

              (text as NSString).draw(
                  with: rect,
                  options: [.usesLineFragmentOrigin, .usesFontLeading],
                  attributes: [
                      .font: font,
                      .foregroundColor: color,
                      .paragraphStyle: paragraph
                  ]
              )
          }

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = context

          let fullRect = NSRect(origin: .zero, size: size)
          NSGradient(colors: [
              NSColor(calibratedRed: 0.972, green: 0.969, blue: 0.982, alpha: 1),
              NSColor(calibratedRed: 0.944, green: 0.955, blue: 0.982, alpha: 1)
          ])!.draw(in: fullRect, angle: -12)

          // Restrained ambient color, echoing Bardo's icon without competing with it.
          NSColor(calibratedRed: 0.49, green: 0.24, blue: 0.68, alpha: 0.07).setFill()
          NSBezierPath(ovalIn: NSRect(x: -95, y: 255, width: 310, height: 310)).fill()

          NSColor(calibratedRed: 0.88, green: 0.35, blue: 0.49, alpha: 0.055).setFill()
          NSBezierPath(ovalIn: NSRect(x: 545, y: 330, width: 250, height: 250)).fill()

          let titleColor = NSColor(calibratedWhite: 0.12, alpha: 0.96)
          let secondaryColor = NSColor(calibratedWhite: 0.28, alpha: 0.82)
          let tertiaryColor = NSColor(calibratedWhite: 0.34, alpha: 0.74)
          let accent = NSColor(calibratedRed: 0.43, green: 0.28, blue: 0.62, alpha: 0.78)

          drawText(
              "Install Bardo",
              in: rectFromTop(x: 80, y: 36, width: 560, height: 42),
              font: .systemFont(ofSize: 28, weight: .semibold),
              color: titleColor
          )

          drawText(
              "Drag Bardo into Applications",
              in: rectFromTop(x: 80, y: 82, width: 560, height: 24),
              font: .systemFont(ofSize: 14.5, weight: .regular),
              color: secondaryColor
          )

          // Visual path between the two real Finder icons.
          let arrow = NSBezierPath()
          arrow.move(to: NSPoint(x: 306, y: 300))
          arrow.line(to: NSPoint(x: 414, y: 300))
          arrow.move(to: NSPoint(x: 397, y: 316))
          arrow.line(to: NSPoint(x: 414, y: 300))
          arrow.line(to: NSPoint(x: 397, y: 284))
          arrow.lineWidth = 3
          arrow.lineCapStyle = .round
          arrow.lineJoinStyle = .round
          accent.setStroke()
          arrow.stroke()

          // Subtle installation guidance card.
          let cardRect = rectFromTop(x: 54, y: 374, width: 612, height: 104)
          let card = NSBezierPath(roundedRect: cardRect, xRadius: 17, yRadius: 17)
          NSColor(calibratedWhite: 1, alpha: 0.58).setFill()
          card.fill()
          NSColor(calibratedWhite: 1, alpha: 0.9).setStroke()
          card.lineWidth = 1
          card.stroke()

          drawText(
              "First launch",
              in: rectFromTop(x: 78, y: 392, width: 564, height: 20),
              font: .systemFont(ofSize: 13, weight: .semibold),
              color: titleColor,
              alignment: .left
          )

          drawText(
              "Bardo isn’t signed by Apple yet. If macOS blocks it, open System Settings → Privacy & Security and choose Open Anyway. You only need to do this once.",
              in: rectFromTop(x: 78, y: 417, width: 564, height: 48),
              font: .systemFont(ofSize: 12.5, weight: .regular),
              color: tertiaryColor,
              alignment: .left,
              lineSpacing: 2
          )

          NSGraphicsContext.restoreGraphicsState()

          guard let png = bitmap.representation(using: .png, properties: [:]) else {
              fatalError("Unable to encode DMG background")
          }

          let output = CommandLine.arguments.count > 1
              ? CommandLine.arguments[1]
              : ".dmg-root/.background/background.png"

          try png.write(to: URL(fileURLWithPath: output))
          SWIFT

          swift /tmp/BardoDMGBackground.swift "$ROOT/.background/background.png"
          test -f "$ROOT/.background/background.png"

          hdiutil create \
            -volname "$VOLNAME" \
            -srcfolder "$ROOT" \
            -fs HFS+ \
            -format UDRW \
            -ov \
            "$RW_DMG"

          DEVICE="$(
            hdiutil attach "$RW_DMG" -readwrite -noverify -noautoopen \
              | awk '/Apple_HFS/ {print $1; exit}'
          )"
          test -n "$DEVICE"

          cleanup() {
            hdiutil detach "$DEVICE" -quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          osascript <<'APPLESCRIPT'
          tell application "Finder"
              tell disk "Bardo Test"
                  open
                  set theWindow to container window
                  set current view of theWindow to icon view
                  set toolbar visible of theWindow to false
                  set statusbar visible of theWindow to false
                  set pathbar visible of theWindow to false
                  set bounds of theWindow to {120, 120, 840, 640}

                  set theViewOptions to icon view options of theWindow
                  set arrangement of theViewOptions to not arranged
                  set icon size of theViewOptions to 96
                  set text size of theViewOptions to 13
                  set background picture of theViewOptions to file ".background:background.png"

                  set position of item "Bardo.app" of theWindow to {180, 214}
                  set position of item "Applications" of theWindow to {540, 214}

                  update without registering applications
                  delay 2
                  close
              end tell
          end tell
          APPLESCRIPT

          sync
          hdiutil detach "$DEVICE"
          trap - EXIT

          hdiutil convert "$RW_DMG" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            -o "$DMG"

          rm -f "$RW_DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload test DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bardo-Reliability-Test-DMG
          path: |
            Bardo-Reliability-Test.dmg
            Bardo-Reliability-Test.dmg.sha256
          if-no-files-found: error
          retention-days: 14
