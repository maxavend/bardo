name: Bardo
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0

targets:
  Bardo:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Bardo
        excludes:
          - Models
          - Resources
      - path: Bardo/Resources/Models
        type: folder
        buildPhase: resources
      - path: Bardo/Models
    resources:
      - path: Bardo/Localization
      - path: Bardo/Resources/Assets.xcassets
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Bardo/Info.plist
      properties:
        CFBundleDisplayName: Bardo
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Bardo records microphone audio only when you choose to start a local recording.
        NSScreenCaptureUsageDescription: Bardo captures audio from content you explicitly choose using the macOS system sharing picker.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxavend.bardo
        PRODUCT_NAME: Bardo
        CODE_SIGN_ENTITLEMENTS: Bardo/Bardo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          OTHER_LDFLAGS:
            - $(inherited)
            - -Xlinker
            - -interposable

  BardoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BardoTests
    dependencies:
      - target: Bardo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxavend.bardo.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bardo:
    build:
      targets:
        Bardo: all
        BardoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BardoTests
    archive:
      config: Release
